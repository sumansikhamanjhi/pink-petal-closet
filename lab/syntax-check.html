<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>syntax check</title></head><body>
<pre id="log">checking…</pre>
<script>
const SINK = "http://localhost:8123";
const post = (u, b) => fetch(SINK + u, { method: "POST", body: b }).catch(e => console.warn(e));
const files = ["../app.js", "../modules/seg-watershed.js", "../modules/garment-cutout.js",
  "../modules/body-model.js", "../modules/garment-fit.js", "../modules/outfit-compose.js",
  "../modules/cutout-paint.js", "../garment-engine.js", "../vlm-service.js", "../tryon-service.js"];
(async function () {
  const report = { files: [] };
  for (const f of files) {
    const src = await fetch(f).then(r => r.text());
    let err = null;
    try { new Function(src); } catch (e) { err = String(e); }
    report.files.push({ file: f, bytes: src.length, error: err });
  }
  report.ok = report.files.every(f => !f.error);
  document.getElementById("log").textContent = JSON.stringify(report, null, 1);
  await post("/report", JSON.stringify(report, null, 1));
})();
</script>
</body></html>
