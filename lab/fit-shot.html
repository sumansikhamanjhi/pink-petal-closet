<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fit shot</title>
<style>body{margin:0;background:#111;color:#eee;font:12px monospace}iframe{width:1000px;height:640px;border:0}</style></head>
<body><pre id="log">running…</pre><iframe id="app" src="../index.html"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const SINK = "http://localhost:8123";
const post = (u, b) => fetch(SINK + u, { method: "POST", body: b }).catch(e => console.warn(e));
const q = new URLSearchParams(location.search);
(async function () {
  const report = {};
  try {
    const f = document.getElementById("app");
    await new Promise(res => { f.onload = res; });
    const win = f.contentWindow, doc = f.contentDocument;
    win.onerror = (m, s, l) => { report.pageError = m + " @" + l; };
    win.localStorage.setItem("pp_mannequin_mode", "composite");
    if (q.get("fresh")) win.localStorage.removeItem("pp_worn_v1");
    await wait(1500);
    doc.querySelector('.nav-btn[data-target="assistant"]').click();
    doc.getElementById("stylist-prompt").value = q.get("prompt") || "coffee date";
    doc.getElementById("btn-generate-outfit").click();
    await wait(Number(q.get("wait") || 70000));
    report.caption = doc.getElementById("mannequin-caption").textContent;
    report.bytes = doc.getElementById("mannequin-render").src.length;
    report.worn = JSON.parse(win.localStorage.getItem("pp_worn_v1") || "{}");
    report.slots = {};
    doc.querySelectorAll("#slot-controls-list .slot-control-item").forEach(row => {
      const t = row.querySelector(".slot-name").textContent.replace(/\s+/g, " ").trim();
      const m = /^([^:]+):\s*(.*?)(?:\s*\(Base.*)?$/.exec(t);
      if (m) report.slots[m[1].trim()] = m[2].trim();
    });
    await post("/save?name=fit_shot.png", doc.getElementById("mannequin-render").src);
    document.getElementById("log").textContent = JSON.stringify(report, null, 1);
  } catch (e) { report.fatal = String(e && e.stack || e); }
  await post("/report", JSON.stringify(report, null, 1));
})();
</script></body></html>
