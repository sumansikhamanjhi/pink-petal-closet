<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Style-around probe</title>
<style>body{margin:0;background:#111;color:#eee;font:12px ui-monospace,monospace}
iframe{width:1100px;height:700px;border:0}pre{white-space:pre-wrap}</style></head>
<body>
<pre id="log">running…</pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const post = (u, b) => fetch(u, { method: "POST", body: b }).catch(e => console.warn(e));

/** Reads the slot rows the way a user sees them: name + whether it is locked. */
function readSlots(doc) {
  const out = {};
  doc.querySelectorAll("#slot-controls-list .slot-control-item").forEach(row => {
    const label = row.querySelector(".slot-name");
    if (!label) return;
    const text = label.textContent.replace(/\s+/g, " ").trim();
    const m = /^([^:]+):\s*(.*?)(?:\s*\(Base Item.*)?$/.exec(text);
    const key = m ? m[1].trim() : text;
    const item = m ? m[2].trim() : "";
    const btn = row.querySelector(".btn-slot-action");
    out[key] = { item, locked: !!btn && btn.classList.contains("slot-locked") };
  });
  return out;
}

(async function () {
  const report = { steps: [] };
  const say = s => { report.steps.push(s); document.getElementById("log").textContent = JSON.stringify(report, null, 1); };
  try {
    const f = document.getElementById("app");
    await new Promise(res => { f.onload = res; });
    const win = f.contentWindow, doc = f.contentDocument;
    win.onerror = (m, s, l) => say("PAGE ERROR " + m + " @" + l);
    await wait(1500);

    doc.querySelector('.nav-btn[data-target="assistant"]').click();
    doc.getElementById("stylist-prompt").value = "casual coffee date";
    doc.getElementById("btn-generate-outfit").click();
    await wait(1200);
    report.afterGenerate = readSlots(doc);

    // 1. the user locks a slot by hand (shoes)
    const rows = Array.from(doc.querySelectorAll("#slot-controls-list .slot-control-item"));
    const shoeRow = rows.find(r => /^Shoes:/.test(r.textContent.trim()));
    report.foundShoeRow = !!shoeRow;
    if (shoeRow) shoeRow.querySelector(".btn-slot-action").click();
    await wait(400);
    report.afterManualLock = readSlots(doc);

    // 2. then picks a base item through the real modal
    doc.getElementById("btn-trigger-manual-select").click();
    await wait(500);
    const cards = Array.from(doc.querySelectorAll("#modal-items-grid > *"));
    const pick = cards.find(c => c.textContent.indexOf("Lavender Ribbed Crop Top") >= 0) || cards[0];
    report.basePicked = pick ? pick.textContent.replace(/\s+/g, " ").trim().slice(0, 40) : null;
    if (pick) pick.click();
    await wait(1500);
    report.afterBasePick = readSlots(doc);
    report.baseLabel = doc.getElementById("base-item-name").textContent;
    report.shuffleAroundVisible =
      doc.getElementById("selected-base-display").style.display !== "none" &&
      !!doc.getElementById("btn-shuffle-around");
    report.hint = doc.getElementById("style-around-hint").textContent;

    // 3. shuffle from the new button, three times, recording what moves
    const seen = [];
    for (let i = 0; i < 3; i++) {
      doc.getElementById("btn-shuffle-around").click();
      await wait(1200);
      seen.push(readSlots(doc));
    }
    report.afterShuffles = seen;

    // did anything held move?
    const base = report.afterBasePick;
    const violations = [];
    const changed = new Set();
    for (const snap of seen) {
      for (const k in base) {
        if (!snap[k]) continue;
        if (base[k].locked && snap[k].item !== base[k].item) violations.push(k + ": " + base[k].item + " -> " + snap[k].item);
        if (!base[k].locked && snap[k].item !== base[k].item) changed.add(k);
      }
    }
    report.lockedItemsThatMoved = violations;
    report.unlockedSlotsThatChanged = Array.from(changed);
    say("done");
  } catch (e) { report.fatal = String(e && e.stack || e); }
  await post("/report", JSON.stringify(report, null, 1));
})();
</script>
</body></html>
