<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Try-on probe</title>
<style>body{margin:0;background:#111;color:#eee;font:12px ui-monospace,monospace}
iframe{width:1100px;height:640px;border:0}pre{white-space:pre-wrap}</style></head>
<body>
<pre id="log">running…</pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
// results go to the lab sink server; the page itself is served by server.ps1
const SINK = "http://localhost:8123";
const post = (u, b) => fetch(SINK + u, { method: "POST", body: b }).catch(e => console.warn(e));
(async function () {
  const report = { steps: [] };
  const say = s => { report.steps.push(s); document.getElementById("log").textContent = JSON.stringify(report, null, 1); };
  try {
    // 1. the proxy's own status
    const st = await fetch("/api/tryon/status").then(r => r.json()).catch(e => ({ error: String(e) }));
    report.serverStatus = st;

    const f = document.getElementById("app");
    await new Promise(res => { f.onload = res; });
    const win = f.contentWindow, doc = f.contentDocument;
    win.onerror = (m, s, l) => say("PAGE ERROR " + m + " @" + l);
    await wait(1800);

    // 2. does the UI reflect the server's state?
    report.barVisible = doc.getElementById("btn-ai-tryon") && doc.getElementById("btn-ai-tryon").style.display !== "none";
    report.prompt = win.TryOnService._buildPrompt([
      { category: "tops", name: "Pink Cable Knit Top" },
      { category: "bottoms", name: "Dark Wash Skinny Jeans" }
    ]).slice(0, 400);

    // 3. generate a look, then ask for a worn render
    doc.querySelector('.nav-btn[data-target="assistant"]').click();
    doc.getElementById("stylist-prompt").value = "everyday casual";
    doc.getElementById("btn-generate-outfit").click();
    await wait(20000);
    const beforeSrc = doc.getElementById("mannequin-render").src;
    report.compositeLen = beforeSrc.length;

    doc.getElementById("btn-ai-tryon").click();
    await wait(20000);
    const afterSrc = doc.getElementById("mannequin-render").src;
    report.afterLen = afterSrc.length;
    report.changed = afterSrc !== beforeSrc;
    report.status = doc.getElementById("tryon-status").textContent;
    await post("/save?name=tryon_result.png", afterSrc);

    // 4. a second request for the same look must come from cache, not the wire
    const t0 = performance.now();
    doc.getElementById("btn-ai-tryon").click();
    await wait(2500);
    report.secondCallMs = Math.round(performance.now() - t0);
    report.secondStatus = doc.getElementById("tryon-status").textContent;
    say("done");
  } catch (e) { report.fatal = String(e && e.stack || e); }
  await post("/report", JSON.stringify(report, null, 1));
})();
</script>
</body></html>
