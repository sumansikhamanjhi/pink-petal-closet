<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mannequin Composite</title>
<style>body{margin:0;background:#fff;font:12px system-ui}
iframe{width:1180px;height:1000px;border:0}</style>
</head>
<body>
<iframe id="app" src="../index.html"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const post = (u, b) => fetch(u, { method: "POST", body: b }).catch(e => console.warn(e));
const q = new URLSearchParams(location.search);

(async function () {
  const report = { steps: [] };
  try {
    const frame = document.getElementById("app");
    await new Promise(res => { frame.onload = res; });
    const win = frame.contentWindow, doc = frame.contentDocument;
    win.onerror = (m, s, l) => report.steps.push("PAGE ERROR " + m + " @" + l);
    await wait(1500);

    // 1. a plain generated look, on the real base mannequin
    doc.querySelector('.nav-btn[data-target="assistant"]').click();
    doc.getElementById("stylist-prompt").value = q.get("prompt") || "casual coffee date";
    doc.getElementById("btn-generate-outfit").click();
    await wait(2500);
    let quick = doc.getElementById("mannequin-render").src;
    report.steps.push("quick paint at 2.5s: " + quick.slice(0, 24) + " len=" + quick.length);
    await post("/save?name=mannequin_quick.png", quick);
    await wait(26000);
    let src = doc.getElementById("mannequin-render").src;
    report.steps.push("generated: " + src.slice(0, 30) + " len=" + src.length);
    await post("/save?name=mannequin_generated.png", src);
    report.breakdown = Array.from(doc.querySelectorAll("#outfit-items-breakdown .breakdown-item, #outfit-items-breakdown > *"))
      .map(e => e.textContent.replace(/\s+/g, " ").trim()).slice(0, 12);

    // 2. upload a garment, then style the outfit around it
    const blob = await fetch("testset/casual_tshirt_jeans.jpg").then(r => r.blob());
    doc.querySelector('.nav-btn[data-target="add"]').click();
    await wait(300);
    win.extractionMode = "top";
    await win.handleImageUpload(new win.File([blob], "grey_tee.jpg", { type: "image/jpeg" }));
    await wait(9000);
    doc.getElementById("item-name").value = "Lab Grey Tee";
    win.saveUploadedItem();
    await wait(800);

    // pick it as the base item through the real modal
    doc.querySelector('.nav-btn[data-target="assistant"]').click();
    await wait(300);
    doc.getElementById("btn-trigger-manual-select").click();
    await wait(600);
    const cards = Array.from(doc.querySelectorAll("#modal-items-grid .modal-item-card, #modal-items-grid > *"));
    const mine = cards.find(c => c.textContent.indexOf("Lab Grey Tee") >= 0);
    report.steps.push("base card found: " + !!mine + " of " + cards.length);
    if (mine) mine.click();
    await wait(12000);

    report.baseLabel = (doc.getElementById("base-item-name") || {}).textContent;
    src = doc.getElementById("mannequin-render").src;
    report.steps.push("styled around base: len=" + src.length);
    await post("/save?name=mannequin_base_item.png", src);

    // 3. shuffle: the base item must stay, the rest must change
    const before = JSON.stringify(win.JSON ? null : null);
    doc.getElementById("btn-shuffle-unlocked").click();
    await wait(12000);
    src = doc.getElementById("mannequin-render").src;
    await post("/save?name=mannequin_after_shuffle.png", src);
    report.slotControls = Array.from(doc.querySelectorAll("#slot-controls-list .slot-control-item"))
      .map(e => e.textContent.replace(/\s+/g, " ").trim());

    // clean up after ourselves
    const closet = JSON.parse(win.localStorage.getItem("pp_wardrobe_v3") || "[]");
    win.localStorage.setItem("pp_wardrobe_v3",
      JSON.stringify(closet.filter(i => i.name !== "Lab Grey Tee")));
  } catch (e) {
    report.fatal = String(e && e.stack || e);
  }
  await post("/report", JSON.stringify(report, null, 1));
  document.title = "READY";
})();
</script>
</body>
</html>
