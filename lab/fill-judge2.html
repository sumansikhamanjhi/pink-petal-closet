<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>judge: fill quality 2</title>
<style>body{margin:0;background:#111;color:#eee;font:12px ui-monospace,monospace;padding:8px}
pre{white-space:pre-wrap}</style></head>
<body>
<pre id="log">running…</pre>
<script src="../modules/seg-watershed.js"></script>
<script src="../modules/garment-cutout.js"></script>
<script>
/**
 * FILL-QUALITY JUDGE, PART 2.
 *
 * Part 1 settled the jacket. This one answers the two remaining questions:
 *
 *  1. Does mirroring INVERT on the props (boots, bag) the way a category-keyed
 *     default assumes it does? If it does not, gating mirror by category is
 *     unjustified.
 *  2. Why did inpaintHoles finish the jacket in seconds and then fail to finish
 *     the floral dress in eleven minutes? The frontier BFS pushes a pixel once
 *     per already-written neighbour without de-duplicating, so the queue can
 *     carry many copies of the same pixel. This measures the queue growth
 *     directly, under a hard cap so it cannot hang the page.
 */
const SINK = "http://localhost:8123";
const post = (u, b) => fetch(SINK + u, { method: "POST", body: b }).catch(e => console.warn(e));
const HB = s => fetch(SINK + "/save?name=hb2-" + s + ".txt", { method: "POST", body: btoa(s) }).catch(() => {});

const CASES = [
  { id: "turtle", cat: "tops",     file: "../assets/olive_turtleneck.jpg",     region: { x: 0.150, y: 0.030, w: 0.700, h: 0.930 } },
  { id: "floral", cat: "dresses",  file: "../assets/floral_white_dress.jpg",   region: { x: 0.240, y: 0.142, w: 0.522, h: 0.800 } },
  { id: "skirt",  cat: "bottoms",  file: "../assets/black_leather_skirt.jpg",  region: { x: 0.180, y: 0.100, w: 0.640, h: 0.800 } },
  { id: "boots",  cat: "footwear", file: "../assets/black_ankle_boots.jpg",    region: { x: 0.120, y: 0.140, w: 0.760, h: 0.740 } },
  { id: "bag",    cat: "bags",     file: "../assets/sage_leather_handbag.jpg", region: { x: 0.150, y: 0.130, w: 0.700, h: 0.740 } }
];

const load = src => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
});

function symmetryAxis(alpha, w, h) {
  const sw = Math.max(8, w >> 2), sh = Math.max(8, h >> 2);
  const a = new Float32Array(sw * sh);
  for (let y = 0; y < sh; y++)
    for (let x = 0; x < sw; x++)
      a[y * sw + x] = alpha[Math.min(h - 1, y * 4) * w + Math.min(w - 1, x * 4)];
  let best = -1, bestAxis = sw / 2;
  for (let ax = Math.floor(sw * 0.30); ax <= Math.ceil(sw * 0.70); ax++) {
    let inter = 0, uni = 0;
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      const m = 2 * ax - x, v = a[y * sw + x];
      const r = (m >= 0 && m < sw) ? a[y * sw + m] : 0;
      inter += Math.min(v, r); uni += Math.max(v, r);
    }
    const iou = uni > 0 ? inter / uni : 0;
    if (iou > best) { best = iou; bestAxis = ax; }
  }
  return { axis: bestAxis * 4, symmetry: best };
}

function mirrorFill(px, known, region, w, h, axis) {
  let done = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = y * w + x;
    if (!region[p]) continue;
    const m = Math.round(2 * axis - x);
    if (m < 0 || m >= w) continue;
    const q = y * w + m;
    if (!known[q] || region[q]) continue;
    px[p * 4] = px[q * 4]; px[p * 4 + 1] = px[q * 4 + 1]; px[p * 4 + 2] = px[q * 4 + 2];
    done++;
  }
  return done;
}

function bandFill(px, known, region, w, h, reach) {
  let done = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = y * w + x;
    if (!region[p]) continue;
    let src = -1;
    for (let k = 1; k <= reach; k++) {
      if (x - k >= 0 && known[y * w + x - k] && !region[y * w + x - k]) { src = x - k; break; }
      if (x + k < w && known[y * w + x + k] && !region[y * w + x + k]) { src = x + k; break; }
    }
    if (src < 0) continue;
    let m = src + (src - x);
    if (m < 0 || m >= w || !known[y * w + m] || region[y * w + m]) m = src;
    const jy = Math.min(h - 1, Math.max(0, y + ((x * 7 + y * 13) % 7) - 3));
    let q = jy * w + m;
    if (!known[q] || region[q]) q = y * w + m;
    px[p * 4] = px[q * 4]; px[p * 4 + 1] = px[q * 4 + 1]; px[p * 4 + 2] = px[q * 4 + 2];
    done++;
  }
  return done;
}

function blurF(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, n = 0;
    for (let d = -r; d <= r; d++) { const xx = x + d; if (xx < 0 || xx >= w) continue; s += src[y * w + xx]; n++; }
    tmp[y * w + x] = s / n;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, n = 0;
    for (let d = -r; d <= r; d++) { const yy = y + d; if (yy < 0 || yy >= h) continue; s += tmp[yy * w + x]; n++; }
    out[y * w + x] = s / n;
  }
  return out;
}

function engineFill(px, hole, known0, w, h) {
  const filled = new Uint8Array(known0);
  let remaining = [];
  for (let p = 0; p < w * h; p++) if (hole[p]) remaining.push(p);
  for (let pass = 0; pass < 64 && remaining.length; pass++) {
    const next = [], writes = [];
    for (const p of remaining) {
      const x = p % w, y = (p - x) / w;
      let r = 0, g = 0, b = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= w) continue;
          const q = yy * w + xx;
          if (!filled[q]) continue;
          r += px[q * 4]; g += px[q * 4 + 1]; b += px[q * 4 + 2]; n++;
        }
      }
      if (n) writes.push([p, r / n, g / n, b / n]); else next.push(p);
    }
    for (const [p, r, g, b] of writes) { px[p * 4] = r; px[p * 4 + 1] = g; px[p * 4 + 2] = b; filled[p] = 1; }
    if (!writes.length) break;
    remaining = next;
  }
  const ch = [0, 1, 2].map(c => {
    const s = new Float32Array(w * h);
    for (let p = 0; p < w * h; p++) s[p] = px[p * 4 + c];
    return blurF(s, w, h, 2);
  });
  for (let p = 0; p < w * h; p++) {
    if (!hole[p]) continue;
    for (let c = 0; c < 3; c++) px[p * 4 + c] = px[p * 4 + c] * 0.35 + ch[c][p] * 0.65;
  }
}

/**
 * inpaintHoles' ring BFS, instrumented and capped.
 * Reports the largest frontier the queue ever held and how it compares with the
 * number of pixels actually left to fill on that ring -- the duplication factor.
 */
function probeInpaintFrontier(hole, w, h, capNodes) {
  const known = new Uint8Array(w * h);
  let holeCount = 0;
  for (let p = 0; p < w * h; p++) { known[p] = hole[p] ? 0 : 1; if (hole[p]) holeCount++; }
  let frontier = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = y * w + x;
    if (!hole[p]) continue;
    if ((x > 0 && known[p - 1]) || (x < w - 1 && known[p + 1]) ||
        (y > 0 && known[p - w]) || (y < h - 1 && known[p + w])) frontier.push(p);
  }
  let rings = 0, visited = 0, maxFrontier = frontier.length, maxDup = 1, capped = false;
  while (frontier.length) {
    rings++;
    visited += frontier.length;
    if (frontier.length > maxFrontier) maxFrontier = frontier.length;
    const uniq = new Set(frontier).size;
    if (uniq > 0) maxDup = Math.max(maxDup, frontier.length / uniq);
    if (visited > capNodes) { capped = true; break; }
    const next = [], writes = [];
    for (const p of frontier) {
      const x = p % w, y = (p - x) / w;
      let n = 0;
      if (x > 0 && known[p - 1]) n++;
      if (x < w - 1 && known[p + 1]) n++;
      if (y > 0 && known[p - w]) n++;
      if (y < h - 1 && known[p + w]) n++;
      if (n) writes.push(p);
    }
    for (const p of writes) known[p] = 1;
    for (const p of writes) {
      const x = p % w, y = (p - x) / w;
      const push = q => { if (hole[q] && !known[q]) next.push(q); };
      if (x > 0) push(p - 1);
      if (x < w - 1) push(p + 1);
      if (y > 0) push(p - w);
      if (y < h - 1) push(p + w);
    }
    frontier = next;
  }
  return { holeCount, rings, nodesVisited: visited, maxFrontier, maxDuplication: +maxDup.toFixed(2), capped,
           visitsPerHolePixel: holeCount ? +(visited / holeCount).toFixed(2) : null };
}

function compare(truth, got, region, w, h) {
  let n = 0, sad = 0, w12 = 0, gT = 0, gG = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const p = y * w + x;
    if (!region[p]) continue;
    let d = 0;
    for (let c = 0; c < 3; c++) d += Math.abs(truth[p * 4 + c] - got[p * 4 + c]);
    d /= 3; sad += d; n++;
    if (d <= 12) w12++;
    for (let c = 0; c < 3; c++) {
      gT += Math.abs(truth[p * 4 + c] - truth[(p + 1) * 4 + c]) + Math.abs(truth[p * 4 + c] - truth[(p + w) * 4 + c]);
      gG += Math.abs(got[p * 4 + c] - got[(p + 1) * 4 + c]) + Math.abs(got[p * 4 + c] - got[(p + w) * 4 + c]);
    }
  }
  return { mae: n ? +(sad / n).toFixed(2) : null, pctWithin12: n ? +(100 * w12 / n).toFixed(1) : null,
           textureRatio: gT > 0 ? +(gG / gT).toFixed(3) : null };
}

const LUMA = [0.2126, 0.7152, 0.0722];
function seamGain(orig, filledPx, known, region, w, h) {
  let sK = 0, nK = 0, sF = 0, nF = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const p = y * w + x;
    if (!region[p] && known[p] && (region[p - 1] || region[p + 1] || region[p - w] || region[p + w])) {
      sK += orig[p * 4] * LUMA[0] + orig[p * 4 + 1] * LUMA[1] + orig[p * 4 + 2] * LUMA[2]; nK++;
    }
    if (region[p] && !(region[p - 1] && region[p + 1] && region[p - w] && region[p + w])) {
      sF += filledPx[p * 4] * LUMA[0] + filledPx[p * 4 + 1] * LUMA[1] + filledPx[p * 4 + 2] * LUMA[2]; nF++;
    }
  }
  if (!nK || !nF || sF <= 0) return 1;
  return Math.max(0.75, Math.min(1.33, (sK / nK) / (sF / nF)));
}

(async function () {
  const report = { cases: [] };
  const say = () => { document.getElementById("log").textContent = JSON.stringify(report, null, 1); };

  const PW = 190, PH = 230, PANELS = 5;
  const sheet = document.createElement("canvas");
  sheet.width = PANELS * PW; sheet.height = CASES.length * PH;
  const sc = sheet.getContext("2d");
  sc.fillStyle = "#101018"; sc.fillRect(0, 0, sheet.width, sheet.height);
  sc.font = "11px monospace";

  for (let ci = 0; ci < CASES.length; ci++) {
    const cse = CASES[ci];
    const entry = { id: cse.id, cat: cse.cat };
    try {
      await HB("load-" + cse.id);
      const img = await load(cse.file);
      const cut = await window.GarmentCutout.extract(img, {
        region: cse.region, category: cse.cat, workingMaxDim: 768, outputMaxDim: 768, padding: 3
      });
      await HB("extracted-" + cse.id);
      const w = cut.width, h = cut.height;
      const orig = cut.canvas.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data;
      const known = new Uint8Array(w * h);
      let kn = 0;
      for (let p = 0; p < w * h; p++) { known[p] = cut.alpha[p] > 0.9 ? 1 : 0; if (known[p]) kn++; }

      const sym = symmetryAxis(cut.alpha, w, h);
      entry.size = { w, h };
      entry.axisFrac = +(sym.axis / w).toFixed(3);
      entry.symmetryIoU = +sym.symmetry.toFixed(3);

      const region = new Uint8Array(w * h);
      let rn = 0;
      const rx0 = Math.round(w * 0.52), rx1 = Math.round(w * 0.88);
      const ry0 = Math.round(h * 0.20), ry1 = Math.round(h * 0.85);
      for (let y = ry0; y < ry1; y++) for (let x = rx0; x < rx1; x++) {
        const p = y * w + x;
        if (known[p]) { region[p] = 1; rn++; }
      }
      entry.amputatedPx = rn;
      entry.amputatedPctOfGarment = kn ? +(100 * rn / kn).toFixed(1) : null;

      // the inpaintHoles frontier measurement, capped so it cannot hang
      await HB("frontier-" + cse.id);
      entry.inpaintHolesFrontier = probeInpaintFrontier(region, w, h, 40e6);

      const mk = () => { const c = new Uint8ClampedArray(orig.length); c.set(orig); return c; };
      const variants = {};

      await HB("mirror-" + cse.id);
      { const px = mk();
        const done = mirrorFill(px, known, region, w, h, sym.axis);
        const g = seamGain(orig, px, known, region, w, h);
        for (let p = 0; p < w * h; p++) if (region[p]) for (let c = 0; c < 3; c++) px[p * 4 + c] *= g;
        variants.mirror = px;
        entry.mirror = Object.assign(compare(orig, px, region, w, h), { coverage: rn ? +(100 * done / rn).toFixed(1) : null, gain: +g.toFixed(3) }); }

      await HB("band-" + cse.id);
      { const px = mk();
        const done = bandFill(px, known, region, w, h, Math.round(w * 0.25));
        variants.band = px;
        entry.band = Object.assign(compare(orig, px, region, w, h), { coverage: rn ? +(100 * done / rn).toFixed(1) : null }); }

      await HB("engine-" + cse.id);
      { const px = mk();
        const k0 = new Uint8Array(w * h);
        for (let p = 0; p < w * h; p++) k0[p] = (known[p] && !region[p]) ? 1 : 0;
        engineFill(px, region, k0, w, h);
        variants.engine = px;
        entry.engine = compare(orig, px, region, w, h); }

      const panels = [["truth", orig], ["cut", null], ["mirror", variants.mirror],
                      ["band", variants.band], ["engine", variants.engine]];
      for (let pi = 0; pi < panels.length; pi++) {
        const [label, data] = panels[pi];
        const tmp = document.createElement("canvas"); tmp.width = w; tmp.height = h;
        const tc = tmp.getContext("2d");
        const im = tc.createImageData(w, h);
        if (data) im.data.set(data);
        else {
          im.data.set(orig);
          for (let p = 0; p < w * h; p++) if (region[p]) { im.data[p * 4] = 255; im.data[p * 4 + 1] = 0; im.data[p * 4 + 2] = 160; }
        }
        for (let p = 0; p < w * h; p++) im.data[p * 4 + 3] = known[p] ? 255 : 0;
        tc.putImageData(im, 0, 0);
        const s = Math.min((PW - 8) / w, (PH - 22) / h);
        sc.fillStyle = "#e8e8ee";
        sc.fillRect(pi * PW + 2, ci * PH + 16, PW - 4, PH - 20);
        sc.drawImage(tmp, pi * PW + (PW - w * s) / 2, ci * PH + 16 + (PH - 20 - h * s) / 2, w * s, h * s);
        sc.fillStyle = "#9fe";
        sc.fillText(cse.id + " " + label, pi * PW + 4, ci * PH + 12);
      }
    } catch (e) {
      entry.error = String(e && e.message || e);
    }
    report.cases.push(entry);
    say();
  }

  await post("/save?name=fill-judge2.png", sheet.toDataURL("image/png").split(",")[1]);
  await post("/report", JSON.stringify(report, null, 1));
})();
</script>
