<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Assistant view</title>
<style>body{margin:0;background:#fff}iframe{width:1180px;height:1050px;border:0}</style></head>
<body>
<iframe id="app" src="../index.html"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
(async function () {
  const f = document.getElementById("app");
  await new Promise(res => { f.onload = res; });
  const win = f.contentWindow, doc = f.contentDocument;
  await wait(1200);
  doc.querySelector('.nav-btn[data-target="assistant"]').click();
  doc.getElementById("stylist-prompt").value = "minimal outfit";
  doc.getElementById("btn-generate-outfit").click();
  await wait(26000);
  doc.getElementById("btn-trigger-manual-select").click();
  await wait(700);
  const cards = Array.from(doc.querySelectorAll("#modal-items-grid > *"));
  const pick = cards.find(c => c.textContent.indexOf("Dark Wash Skinny Jeans") >= 0) || cards[0];
  if (pick) pick.click();
  await wait(22000);
  document.title = "READY";
})();
</script>
</body></html>
